<body>

<div class="institute-card">
    <div class="institution-header">
        <div class="logo-area">
            <div class="institute-symbol">
                <svg width="30" height="30" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" stroke="#cfa85d" stroke-width="5" fill="none"/>
                    <circle cx="33" cy="35" r="12" stroke="#cfa85d" stroke-width="6" fill="none"/>
                    <circle cx="67" cy="35" r="12" stroke="#cfa85d" stroke-width="6" fill="none"/>
                    <circle cx="33" cy="35" r="4" fill="#cfa85d"/>
                    <circle cx="67" cy="35" r="4" fill="#cfa85d"/>
                    <path d="M20 48 C 20 78, 80 78, 80 48" stroke="#cfa85d" stroke-width="7" stroke-linecap="round" fill="none"/>
                    <path d="M30 68 L 50 80 L 70 68" stroke="#cfa85d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>

        <p style="font-size: 0.75rem; color: #666; margin-bottom: 10px;">全15問の個別ファイル（画像/音声）をそれぞれ差し替え可能です。</p>
        
        <div id="admin-file-list"></div>

        <button class="close-modal-btn" onclick="closeAdminModal()">設定を確定して戻る</button>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const SETTING_PASSWORD = "393230";
    
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5RMbHIZOzQyw_fG-hkBseYKMs9WuZ63Zr7nGokzKWLGclHOcjxW3Sjoe0-UNi0V3j/exec";

    let examineeName = "";
    let questionDetails = [];

    // 有名な日本のカエルプールの定義
    const famousJapaneseFrogs = [
        "シュレーゲルアオガエル",
        "ニホンアマガエル",
        "モリアオガエル",
        "カジカガエル",
        "トノサマガエル",
        "トウキョウダルマガエル",
        "ニホンヒキガエル",
        "ツチガエル",
        "ニホンアカガエル",
        "ヤマアカガエル",
        "ヌマガエル",
        "ウシガエル"
    ];

    function playSyntheticSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        if (type === 'amagaeru') {
            for(let i=0; i<4; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(650, now + i*0.1);
                osc.frequency.exponentialRampToValueAtTime(320, now + i*0.1 + 0.07);
                gain.gain.setValueAtTime(0.3, now + i*0.1); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.07);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i*0.1); osc.stop(now + i*0.1 + 0.07);
            }
        } else if (type === 'ushigaeru') {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'kajika') {
            for(let i=0; i<6; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200 + i*150, now + i*0.06);
                gain.gain.setValueAtTime(0.15, now + i*0.06); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.06 + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i*0.06); osc.stop(now + i*0.06 + 0.05);
            }
        } else if (type === 'kajika_sound') {
            for(let i=0; i<5; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(900 + i*120, now + i*0.08);
                gain.gain.setValueAtTime(0.2, now + i*0.08); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.08 + 0.06);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i*0.08); osc.stop(now + i*0.08 + 0.06);
            }
        } else if (type === 'minmin_frog') {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(500, now);
            osc.frequency.linearRampToValueAtTime(700, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'SE_correct') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + idx*0.08);
                gain.gain.setValueAtTime(0.2, now + idx*0.08); gain.gain.exponentialRampToValueAtTime(0.01, now + idx*0.08 + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + idx*0.08); osc.stop(now + idx*0.08 + 0.2);
            });
        } else if (type === 'SE_wrong') {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now+0.3);
        }
    }

    const quizData = [
        // 【画像クイズ 5問】
        {
            type: 'image', customSrc: null,

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let currentOptions = [];
    let correctAnswerIndex = 0;

    function startExam() {
        const nameInput = document.getElementById('examinee-name').value.trim();
        if (!nameInput) {
            alert("受験者のお名前を入力してください。");
            return;
        }
        examineeName = nameInput;
        questionDetails = [];
        document.getElementById('name-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    function initAdminModalList() {
        const listContainer = document.getElementById('admin-file-list');
        listContainer.innerHTML = '';
        quizData.forEach((q, idx) => {
            const div = document.createElement('div');
            div.className = 'file-input-group';
            div.innerHTML = `<strong>第${idx + 1}問 (${q.type === 'sound' ? '音声' : '画像'})</strong><br>
                ファイル指定: <input type="file" accept="${q.type === 'sound' ? 'audio/*' : 'image/*'}" onchange="loadCustomFile(${idx}, '${q.type}', this)">`;
            listContainer.appendChild(div);
        });
    }

    function openAdminModal() {
        const inputPass = prompt("管理者用パスワードを入力してください:");
        if (inputPass === SETTING_PASSWORD) {
            initAdminModalList();
            document.getElementById('admin-modal').style.display = 'flex';
        } else if (inputPass !== null) {
            alert("認証エラー: パスワードが一致しません。");
        }
    }

    function closeAdminModal() {
        document.getElementById('admin-modal').style.display = 'none';
    }

    function toggleHint() {
        const content = document.getElementById('hint-content');
        const btn = document.querySelector('.hint-toggle-btn');
        if (content.style.display === 'block') {
            content.style.display = 'none';
            btn.innerHTML = '🔍 ヒントを閲覧する（折りたたみ） 🔽';
        } else {
            content.style.display = 'block';
            btn.innerHTML = '🔍 ヒントを閉じる 🔼';
        }
    }

    function loadCustomFile(qIndex, type, input) {
        const file = input.files[0];
        if (!file) return;
        const fileURL = URL.createObjectURL(file);
        quizData[qIndex].customSrc = fileURL;
        if (currentQuestionIndex === qIndex) loadQuestion();
    }

    function playAudio(qIndex) {
        const data = quizData[qIndex];
        if (data.customSrc && data.type === 'sound') {
            const audio = new Audio(data.customSrc);
            audio.play();
        } else {
            playSyntheticSound(data.synthSound || 'amagaeru');
        }
    }

    function generateOptions(correctAnswer) {
        let pool = famousJapaneseFrogs.filter(f => f !== correctAnswer);
        // ランダムに3つ選出
        let shuffledPool = pool.sort(() => 0.5 - Math.random());
        let wrongOptions = shuffledPool.slice(0, 3);
        
        let options = [correctAnswer, ...wrongOptions];
        // 選択肢の順番をシャッフル
        options = options.sort(() => 0.5 - Math.random());
        
        correctAnswerIndex = options.indexOf(correctAnswer);
        return options;
    }

    function loadQuestion() {
        answered = false;
        const currentData = quizData[currentQuestionIndex];
        
        currentOptions = generateOptions(currentData.correctAnswer);

        document.getElementById('question-number').innerText = `第${currentQuestionIndex + 1}問 / 全15問`;
        document.getElementById('score-count').innerText = `適性スコア: ${score}`;
        document.getElementById('progress-bar').style.width = `${(currentQuestionIndex / quizData.length) * 100}%`;

        const stage = document.getElementById('stage-box');
        if (currentData.type === 'sound') {
            stage.innerHTML = `<button class="sound-btn" onclick="playAudio(${currentQuestionIndex})">🔊 音声標本を再生する</button>`;
        } else if (currentData.customSrc && currentData.type === 'image') {
            stage.innerHTML = `<img src="${currentData.customSrc}" class="quiz-img" alt="標本画像">`;
        } else {
            stage.innerHTML = currentData.svgFallback;
        }

        document.getElementById('question').innerText = currentData.question;
        
        const hintContent = document.getElementById('hint-content');
        hintContent.innerText = currentData.hint;
        hintContent.style.display = 'none';
        document.querySelector('.hint-toggle-btn').innerHTML = '🔍 ヒントを閲覧する（折りたたみ） 🔽';

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, index) => {
            btn.innerText = `${index + 1}. ${currentOptions[index]}`;
            btn.className = 'option-btn';
            btn.disabled = false;
        });

        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function selectAnswer(selectedIndex) {
        if (answered) return;
        answered = true;

        const currentData = quizData[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctAnswerIndex) {
            buttons[selectedIndex].classList.add('correct');
            playSyntheticSound('SE_correct');
            // 紙吹雪の演出は削除しました
            score++;
            questionDetails.push("〇");
            document.getElementById('score-count').innerText = `適性スコア: ${score}`;
        } else {
            buttons[selectedIndex].classList.add('wrong');
            buttons[correctAnswerIndex].classList.add('correct');
            playSyntheticSound('SE_wrong');
            questionDetails.push("×");
        }

        document.getElementById('explanation').innerHTML = currentData.explanation;
        document.getElementById('explanation').style.display = 'block';
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerText = (currentQuestionIndex === quizData.length - 1) ? '最終鑑定結果を確認 ➔' : '次の問題へ進む ➔';
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) loadQuestion();
        else showResult();
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
        document.getElementById('cert-user-title').innerText = `${examineeName} さんの能力鑑定結果`;
        
        let statusText = "";
        let msg = "";
        if (score === quizData.length) {
            statusText = "合格";
            msg = "【判定: 【合格】】<br>全15問全問正解です！卓越した両生類識別・生態鑑定能力が認められました。";
        } else {
            statusText = "不合格（再試験必要）";
            msg = "【判定: 【不合格】再試験が必要です】<br>合格には全問正解（15問中15問）が必須となります。";
        }
        document.getElementById('result-message').innerHTML = msg;

        const sheetStatus = document.getElementById('sheet-status');
        sheetStatus.innerText = `[送信中] 試験結果を管理者へ送信しています...`;

        if (GAS_WEB_APP_URL) {
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: examineeName,
                    score: score,
                    total: quizData.length,
                    status: statusTest,
                    details: questionDetails
                })
            }).then(() => {
                sheetStatus.innerText = `試験結果は管理者に送信されました`;
            }).catch(() => {
                sheetStatus.innerText = `試験結果は管理者に送信されました`;
            });
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0; score = 0; questionDetails = [];
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('name-screen').style.display = 'block';
        document.getElementById('examinee-name').value = "";
    }
</script>
