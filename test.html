<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5RMbHIZOzQyw_fG-hkBseYKMs9WuZ63Zr7nGokzKWLGclHOcjxW3Sjoe0-UNi0V3j/exec";

    let examineeName = "";
    let questionDetails = [];
    let selectedQuizList = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let currentShuffledOptions = [];
    let currentCorrectAnswerText = "";
    let currentAudio = null;

    function stopCurrentAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
        }
    }

    function playSyntheticSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        if (type === 'amagaeru') {
            for(let i=0; i<4; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(650, now + i*0.1);
                osc.frequency.exponentialRampToValueAtTime(320, now + i*0.1 + 0.07);
                gain.gain.setValueAtTime(0.3, now + i*0.1); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.07);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i*0.1); osc.stop(now + i*0.1 + 0.07);
            }
        } else if (type === 'ushigaeru') {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'kajika') {
            for(let i=0; i<6; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200 + i*150, now + i*0.06);
                gain.gain.setValueAtTime(0.15, now + i*0.06); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.06 + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i*0.06); osc.stop(now + i*0.06 + 0.05);
            }
        } else if (type === 'schlegel') {
            for(let i=0; i<3; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(1800, now + i*0.12);
                gain.gain.setValueAtTime(0.2, now + i*0.12); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.12 + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i*0.12); osc.stop(now + i*0.12 + 0.08);
            }
        } else if (type === 'tonosama') {
            for(let i=0; i<5; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now + i*0.08);
                gain.gain.setValueAtTime(0.2, now + i*0.08); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.08 + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i*0.08); osc.stop(now + i*0.08 + 0.05);
            }
        } else if (type === 'numa') {
            for(let i=0; i<5; i++) {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(950, now + i*0.07);
                osc.frequency.exponentialRampToValueAtTime(500, now + i*0.07 + 0.04);
                gain.gain.setValueAtTime(0.25, now + i*0.07); gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.07 + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i*0.07); osc.stop(now + i*0.07 + 0.04);
            }
        } else if (type === 'SE_correct') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + idx*0.08);
                gain.gain.setValueAtTime(0.2, now + idx*0.08); gain.gain.exponentialRampToValueAtTime(0.01, now + idx*0.08 + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + idx*0.08); osc.stop(now + idx*0.08 + 0.2);
            });
        } else if (type === 'SE_wrong') {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.3);

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildExamDataset() {
        const selectedEco = shuffleArray(ecoPool).slice(0, 10);
        const selectedView = shuffleArray(viewPool).slice(0, 5);
        const selectedVoice = shuffleArray(voicePool).slice(0, 5);
        return [...selectedEco, ...selectedView, ...selectedVoice];
    }

    function startExam() {
        const nameInput = document.getElementById('examinee-name').value.trim();
        if (!nameInput) {
            alert("受験者の名前を入力してください。");
            return;
        }
        examineeName = nameInput;
        questionDetails = [];
        currentQuestionIndex = 0;
        score = 0;

        selectedQuizList = buildExamDataset();

        document.getElementById('name-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    function toggleHint() {
        const content = document.getElementById('hint-content');
        const btn = document.querySelector('.hint-toggle-btn');
        if (content.style.display === 'block') {
            content.style.display = 'none';
            btn.innerHTML = '🔍 ヒントを閲覧する 🔽';
        } else {
            content.style.display = 'block';
            btn.innerHTML = '🔍 ヒントを閉じる 🔼';
        }
    }

    function playAudio(qIndex) {
        stopCurrentAudio();
        const data = selectedQuizList[qIndex];
        const audioSrc = `image/${data.id}.mp3`;
        
        currentAudio = new Audio(audioSrc);
        currentAudio.play().catch(error => {
            console.log("音声ファイルの読み込みに失敗したため、合成音声を再生します。", error);
            playSyntheticSound(data.synthSound || 'amagaeru');
        });
    }

    function loadQuestion() {
        stopCurrentAudio();
        answered = false;
        const currentData = selectedQuizList[currentQuestionIndex];

        const badge = document.getElementById('category-badge');
        badge.innerText = `【ジャンル】${currentData.genre}`;

        document.getElementById('question-number').innerText = `第${currentQuestionIndex + 1}問 / 全${selectedQuizList.length}問`;
        document.getElementById('score-count').innerText = `正解数: ${score}`;
        document.getElementById('progress-bar').style.width = `${(currentQuestionIndex / selectedQuizList.length) * 100}%`;

        const stage = document.getElementById('stage-box');
        const explanationImgBox = document.getElementById('explanation-img-box');
        
        explanationImgBox.style.display = 'none';

        if (currentData.type === 'eco-image') {
            stage.style.display = 'none';
        } else {
            stage.style.display = 'flex';
            if (currentData.type === 'sound') {
                stage.innerHTML = `<button class="sound-btn" onclick="playAudio(${currentQuestionIndex})">🔊 音声標本を再生する</button>`;
            } else {
                const activeImgSrc = `image/${currentData.id}.jpg`;
                stage.innerHTML = `<img src="${activeImgSrc}" class="quiz-img" alt="標本画像" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` +
                                  `<div style="display:none; width:100%; height:100%; align-items:center; justify-content:center; position:absolute; top:0; left:0;">${svgDefaultFallback}</div>`;
            }
        }

        document.getElementById('question').innerText = `【第${currentQuestionIndex + 1}問】` + currentData.question;
        
        const hintContent = document.getElementById('hint-content');
        hintContent.innerHTML = `${currentData.hint}<span class="hint-notice">ヒントの閲覧履歴は記録しています。</span>`;
        hintContent.style.display = 'none';
        document.querySelector('.hint-toggle-btn').innerHTML = '🔍 ヒントを閲覧する 🔽';

        currentCorrectAnswerText = currentData.options[currentData.correctAnswerIndex];
        currentShuffledOptions = shuffleArray(currentData.options);

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, index) => {
            btn.innerText = `${index + 1}. ${currentShuffledOptions[index]}`;
            btn.className = 'option-btn';
            btn.disabled = false;
        });

        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function selectAnswer(selectedIndex) {
        if (answered) return;
        answered = true;

        stopCurrentAudio();

        const currentData = selectedQuizList[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        const selectedText = currentShuffledOptions[selectedIndex];
        const correctIndexInShuffled = currentShuffledOptions.indexOf(currentCorrectAnswerText);

        if (selectedText === currentCorrectAnswerText) {
            buttons[selectedIndex].classList.add('correct');
            playSyntheticSound('SE_correct');
            score++;
            questionDetails.push("〇");
            document.getElementById('score-count').innerText = `正解数: ${score}`;
        } else {
            buttons[selectedIndex].classList.add('wrong');
            buttons[correctIndexInShuffled].classList.add('correct');
            playSyntheticSound('SE_wrong');
            questionDetails.push("×");
        }

        document.getElementById('explanation').innerHTML = currentData.explanation;
        document.getElementById('explanation').style.display = 'block';

        if (currentData.type === 'eco-image') {
            const expImgBox = document.getElementById('explanation-img-box');
            const expImg = document.getElementById('explanation-img');
            
            expImgBox.style.display = 'block';
            expImg.src = `image/${currentData.id}.jpg`;
        }
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerText = (currentQuestionIndex === selectedQuizList.length - 1) ? '最終鑑定結果を確認 ➔' : '次の問題へ進む ➔';
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < selectedQuizList.length) loadQuestion();
        else showResult();
    }

    function showResult() {
        stopCurrentAudio();
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('pass-criteria').innerText = `合格基準：全問正解（${selectedQuizList.length}/${selectedQuizList.length}）必須`;
        document.getElementById('final-score').innerText = `${score} / ${selectedQuizList.length}`;
        document.getElementById('cert-user-title').innerText = `${examineeName} さんの能力鑑定結果`;
        
        let statusText = "";
        let msg = "";
        if (score === selectedQuizList.length) {
            statusText = "合格";
            msg = `【判定: 【合格】】<br>全${selectedQuizList.length}問全問正解です！卓越した両生類識別・生態鑑定能力が認められました。`;
        } else {
            statusText = "不合格（再試験必要）";
            msg = `【判定: 【不合格】再試験が必要です】<br>合格には全問正解（${selectedQuizList.length}問中${selectedQuizList.length}問）が必須となります。`;
        }
        document.getElementById('result-message').innerHTML = msg;

        const sheetStatus = document.getElementById('sheet-status');
        sheetStatus.innerText = `[送信中] 試験結果を管理者へ送信しています...`;

        if (GAS_WEB_APP_URL) {
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: examineeName,
                    score: score,
                    total: selectedQuizList.length,
                    status: statusText,
                    details: questionDetails
                })
            }).then(() => {
                sheetStatus.innerText = `試験結果は管理者に送信されました`;
            }).catch(() => {
                sheetStatus.innerText = `試験結果は管理者に送信されました`;
            });
        }
    }

    function restartQuiz() {
        stopCurrentAudio();
        currentQuestionIndex = 0; score = 0; questionDetails = [];
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('name-screen').style.display = 'block';
        document.getElementById('examinee-name').value = "";
    }
</script>

</body>
</html>
